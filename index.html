<html>
    <head>
        <title>i did not listen in science class</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
        <script src="script.js" defer></script>
    </head>
    <body>
        <button id="darkmodebutton" onclick="darkmode()">plunge into darkness</button>
        <div class="inputs">
            <div> 
                protons: <input type="number" class="ibox" id="protons">
            </div>
            <div> 
                neutrons: <input type="number" class="ibox" id="neutrons">
            </div>
            <div> 
                electrons: <input type="number" class="ibox" id="electrons">
            </div>
        </div>
        <div class="buttons">
            <button onclick=atom()> atom or ion? </button>
            <button onclick=charge()> net charge </button>
            <button onclick=mass()> mass number </button>
            <button onclick=element()> element </button>
        </div>
        <div class="results">
            <p class="atomion">atom or ion: </p> <p class="atomion" id="atomorion"></p>
            <br>
            <p class="netcharge">net charge: </p> <p class="netcharge" id="charge"></p>
            <br>
            <p class="atomicmass">mass number: </p> <p class="atomicmass" id="mass"></p>
            <br>
            <p class="element">element: </p> <p class="element" id="element"></p>
        </div>
        <br>
        <br>
        <p>did you get what you needed?</p>
        <button id="confettiBtn"> yess! </button>
        <br>
        <br>
        <br>
        <footer>
            <p>this was made by <a href="https://humaninexistance.github.io/ME/">sanika</a>, go check out her website</p>
        </footer>
    </body>
</html>
